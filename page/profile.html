<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Acki</title>

    <link rel="icon" type="image/png" href="../pic/logo1.png">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="../css/middle.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>

<body>
    <div class="edge-tab edge-top">
        <a href="./profile.html" title="My Profile" class="my-profile-link">
            <i class="ti ti-user-circle"></i>
        </a>
        <i class="ti ti-home" title="Home" onclick="goHome()"></i>
        <div class="nav-icon-wrap">
            <i class="ti ti-bell" title="Notification" onclick="toggleNotificationMini()"></i>
            <span class="notification-dot" id="notificationDot"></span>
        </div>
        <i class="ti ti-mail" title="Contact" onclick="goContact()"></i>
        <i class="ti ti-info-hexagon" title="About" onclick="goAbout()"></i>

        <div class="settings-wrap">
            <i class="ti ti-dots-vertical" title="Settings" onclick="toggleSettingsMenu()"></i>
            <div class="settings-menu" id="settingsMenu">
                <button type="button" onclick="setThemeMode('auto')" data-theme-option="auto">Default Theme</button>
                <button type="button" onclick="setThemeMode('light')" data-theme-option="light">Light Theme</button>
                <button type="button" onclick="setThemeMode('dark')" data-theme-option="dark">Dark Theme</button>
                <hr>
                <button type="button" onclick="toggleSceneBackground()">Stage Background <span class="setting-state"
                        data-setting-state="scene">On</span></button>
                <button type="button" onclick="toggleWeather()">Weather Effects <span class="setting-state"
                        data-setting-state="weather">On</span></button>
            </div>
        </div>
        <button type="button" class="lang-toggle" onclick="toggleLanguage()">TH</button>
    </div>

    <button id="profileCreatePostButton" type="button" class="profile-create-post-button"
        onclick="openProfileComposer()" hidden>
        <i class="ti ti-plus"></i>
        <span>Create Post</span>
    </button>

    <section id="profileComposer" class="profile-composer" aria-hidden="true">
        <div class="profile-composer-inner">
            <div class="profile-composer-head">
                <h2 id="profileComposerTitle">Create Post</h2>
                <button type="button" class="profile-composer-close" onclick="closeProfileComposer()"
                    aria-label="Close">×</button>
            </div>
            <textarea id="profileComposerText" maxlength="2000" placeholder="Share something..."></textarea>
            <div class="profile-composer-actions">
                <button type="button" class="profile-composer-cancel" onclick="closeProfileComposer()">Cancel</button>
                <button id="profileComposerSubmit" type="button" class="profile-composer-submit"
                    onclick="submitProfilePost()">Post</button>
            </div>
        </div>
    </section>

    <main class="profile-page">
        <p id="profileLoading" class="profile-loading">Loading profile...</p>

        <div id="profileContent" hidden>
            <section class="profile-header">
                <div class="profile-header-top">
                    <div class="profile-main">
                        <div class="profile-avatar" id="profileAvatar">A</div>
                        <div class="profile-info">
                            <h1 id="profileDisplayName">Display name</h1>
                            <p id="profileUsername" class="profile-username">@username</p>
                            <p id="profileJoined" class="profile-joined">Joined</p>
                        </div>
                    </div>

                    <div class="profile-card-menu-wrap" id="profileMenuWrap" hidden>
                        <button type="button" class="profile-menu-button" aria-label="Profile menu"
                            onclick="toggleProfileHeaderMenu(event)">
                            <i class="ti ti-dots"></i>
                        </button>

                        <div class="profile-card-menu" id="profileHeaderMenu">
                            <button type="button" onclick="openEditProfileModal()"><i class="ti ti-pencil"></i> Edit
                                Profile</button>
                            <button type="button" onclick="shareProfileLink()"><i class="ti ti-share-3"></i> Share
                                Profile</button>
                            <button type="button" class="danger" onclick="logout()"><i class="ti ti-logout"></i>
                                Logout</button>
                        </div>
                    </div>
                </div>

                <div class="profile-bio-section" id="profileBioSection" hidden>
                    <p class="profile-bio-text" id="profileBioInline"></p>
                </div>
            </section>

            <nav class="profile-tabs">
                <button type="button" class="profile-tab active" data-tab="posts"
                    onclick="switchProfileTab('posts', this)">Posts</button>
                <button type="button" class="profile-tab" data-tab="likes"
                    onclick="switchProfileTab('likes', this)">Likes</button>
                <button type="button" class="profile-tab" data-tab="saved"
                    onclick="switchProfileTab('saved', this)">Saved</button>
            </nav>

            <section class="profile-tab-content" id="profileTabContent"></section>
        </div>
    </main>

    <div id="profileDeleteOverlay" class="profile-modal-overlay" onclick="closeProfileDeleteModal()"></div>
    <section id="profileDeleteModal" class="profile-delete-modal" role="dialog" aria-modal="true">
        <h2>Delete this post?</h2>
        <p>This action cannot be undone.</p>
        <div class="profile-delete-actions">
            <button type="button" onclick="closeProfileDeleteModal()">Cancel</button>
            <button type="button" class="danger" onclick="confirmProfileDelete()">Delete</button>
        </div>
    </section>

    <div id="profileEditOverlay" class="profile-modal-overlay" onclick="closeEditProfileModal()"></div>

    <section id="editProfileModal" class="profile-edit-modal" role="dialog" aria-modal="true">
        <div class="profile-edit-head">
            <h2>Edit Profile</h2>
            <button type="button" class="profile-edit-close" onclick="closeEditProfileModal()"
                aria-label="Close">×</button>
        </div>

        <div class="edit-profile-field">
            <label for="editProfileDisplayName">Display Name</label>
            <input type="text" id="editProfileDisplayName" maxlength="50" placeholder="Display name">
        </div>

        <div class="edit-profile-field">
            <label for="editProfileUsername">Username</label>
            <input type="text" id="editProfileUsername" maxlength="30" placeholder="username">
        </div>

        <div class="edit-profile-field">
            <label for="editProfileBio">Bio</label>
            <textarea id="editProfileBio" maxlength="200" placeholder="Tell us about yourself..."></textarea>
        </div>

        <div class="profile-avatar-upload">

            <img id="avatarPreview" class="profile-avatar-preview" src="../pic/visitor.jpg" alt="Avatar">

            <input type="file" id="avatarInput" accept="image/*" hidden>

            <button type="button" class="change-avatar-btn" onclick="document.getElementById('avatarInput').click()">
                Change Photo
            </button>

        </div>

        <p id="editProfileError" class="edit-profile-error" hidden></p>

        <div class="profile-delete-actions">
            <button type="button" onclick="closeEditProfileModal()">Cancel</button>
            <button id="editProfileSubmit" type="button" class="profile-edit-save"
                onclick="submitEditProfile()">Save</button>
        </div>
    </section>

    <script src="../js/auth.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/language.js"></script>
    <script src="../js/appearance.js"></script>
    <script src="../js/notification.js"></script>
    <script src="../js/profile.js"></script>
</body>

</html>
